<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1f">
<title>Astro Mobile Access</title>
<style>
:root { --bg: #070b1f; --card: #101739; --line: #2a3570; --text: #eef1ff; --dim: #9aa5d8; --accent: #7c9bff; --accent2: #c18bff; --bad: #ff7a7a; color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body {
  min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background-image: radial-gradient(ellipse at 50% -10%, rgba(124,155,255,.25), transparent 60%), radial-gradient(circle at 85% 90%, rgba(193,139,255,.15), transparent 50%);
}
main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 22px; text-align: center; }
.logo { font-size: 54px; line-height: 1; filter: drop-shadow(0 0 18px rgba(124,155,255,.6)); }
h1 { margin: 0; font-size: 28px; letter-spacing: .01em; }
.sub { margin: 6px 0 0; color: var(--dim); font-size: 16px; }
.btns { display: flex; flex-direction: column; gap: 14px; }
.svc { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 14px 18px; text-align: left; font: inherit; color: var(--text); background: var(--card); border: 2px solid var(--line); border-radius: 18px; cursor: pointer; transition: transform .1s, border-color .15s; }
.svc:active { transform: scale(.98); border-color: var(--accent); }
.svc[disabled] { opacity: .55; cursor: wait; }
.svc .ic { font-size: 30px; flex: none; width: 44px; text-align: center; }
.svc b { display: block; font-size: 19px; }
.svc small { display: block; color: var(--dim); font-size: 14px; margin-top: 2px; }
.svc .go { margin-left: auto; color: var(--accent); font-size: 26px; flex: none; }
.svc.loading .go { animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .svc.loading .go { animation: none; } .svc { transition: none; } }
#status { min-height: 44px; font-size: 15px; color: var(--dim); }
#status.err { color: var(--bad); }
#retry { display: none; margin-top: 8px; font: inherit; color: var(--text); background: transparent; border: 2px solid var(--accent); border-radius: 12px; padding: 8px 18px; min-height: 40px; cursor: pointer; }
.fine { color: var(--dim); font-size: 13px; opacity: .8; }
button:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div>
    <div class="logo" aria-hidden="true">&#128640;</div>
    <h1>Astro Mobile Access</h1>
    <p class="sub">Access Astro Services on Mobile</p>
  </div>

  <div class="btns">
    <button type="button" class="svc" data-svc="messages">
      <span class="ic" aria-hidden="true">&#128172;</span>
      <span><b>Messages</b><small>Chat, groups and calls</small></span>
      <span class="go" aria-hidden="true">&rsaquo;</span>
    </button>
    <button type="button" class="svc" data-svc="forums">
      <span class="ic" aria-hidden="true">&#128421;</span>
      <span><b>Vee-Forums</b><small>Boards, threads and replies</small></span>
      <span class="go" aria-hidden="true">&rsaquo;</span>
    </button>
  </div>

  <div id="status" role="status" aria-live="polite">
    <span id="status-text">Pick a service to open it.</span><br>
    <button type="button" id="retry">Try again</button>
  </div>
  <div class="fine">Loaded through jsDelivr</div>
</main>

<script>
(function () {
  // Each service is a file on GitHub, served through jsDelivr.
  var SERVICES = {
    messages: { name: 'Messages',    path: 'Joeclickavit/MessagesMobile@main/Messages-mobile-only.html' },
    forums:   { name: 'Vee-Forums',  path: 'Joeclickavit/VeeForumMobile@main/index.html' }
  };
  // jsDelivr mirrors, tried in order if one is blocked or down.
  var HOSTS = ['https://cdn.jsdelivr.net/gh/', 'https://fastly.jsdelivr.net/gh/', 'https://gcore.jsdelivr.net/gh/'];
  var TIMEOUT_MS = 20000;

  var statusText = document.getElementById('status-text');
  var statusBox = document.getElementById('status');
  var retry = document.getElementById('retry');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.svc'));
  var current = null, busy = false;

  function say(msg, isErr) {
    statusText.textContent = msg;
    statusBox.className = isErr ? 'err' : '';
    retry.style.display = isErr ? 'inline-block' : 'none';
  }
  function setBusy(on, key) {
    busy = on;
    buttons.forEach(function (b) {
      b.disabled = on;
      b.classList.toggle('loading', on && b.getAttribute('data-svc') === key);
    });
  }

  function fetchText(url) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, TIMEOUT_MS);
    return fetch(url, { signal: ctl.signal, cache: 'no-cache' }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }, function (e) { clearTimeout(timer); throw e; });
  }

  function fetchService(svc) {
    var i = 0, lastErr = null;
    function next() {
      if (i >= HOSTS.length) return Promise.reject(lastErr || new Error('No mirror worked'));
      var url = HOSTS[i++] + svc.path;
      return fetchText(url).then(function (html) {
        if (!/<html|<!doctype|<body|<script/i.test(html)) throw new Error('Unexpected response');
        return html;
      }).catch(function (e) { lastErr = e; return next(); });
    }
    return next();
  }

  // jsDelivr serves .html as plain text, so the page is fetched and written in
  // place of this loader instead of being navigated to.
  function launch(key) {
    var svc = SERVICES[key];
    if (!svc || busy) return;
    current = key;
    setBusy(true, key);
    say('Loading ' + svc.name + '...');
    fetchService(svc).then(function (html) {
      document.open();
      document.write(html);
      document.close();
    }).catch(function (e) {
      setBusy(false);
      say('Could not load ' + svc.name + '. Check your connection and try again.' + (e && e.message ? ' (' + e.message + ')' : ''), true);
    });
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { launch(b.getAttribute('data-svc')); });
  });
  retry.addEventListener('click', function () { if (current) launch(current); });

  // Optional shortcuts: ...Astro-Mobile-Access.html#messages or #forums
  var h = (location.hash || '').replace('#', '').toLowerCase();
  if (SERVICES[h]) launch(h);
})();
</script>
</body>
</html>
