<!DOCTYPE html>
<html>
<head>
    <title>Loader</title>
</head>
<body style="margin: 0;">
    <button onclick="load()" style="width: 100%; height: 100vh; font-size: 50px; cursor: pointer;">
        LAUNCH
    </button>
    <script>
        function load() {
            fetch('https://cdn.jsdelivr.net/gh/Joeclickavit/AstroWithUpdates@main/astro.html')
                .then(r => r.text())
                .then(t => {
                    const w = window.open('about:blank', '_blank');
                    if (w) {
                        w.document.open();
                        w.document.write(t);
                        w.document.close();
                        // Closes the current tab after the new one is opened
                        window.close();
                    } else {
                        alert("Please allow pop-ups.");
                    }
                });
        }
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1233950332158714"
     crossorigin="anonymous"></script>
</body>
</html>
